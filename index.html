<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Minimarket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
        }
        h1 {
            background: #2e7d32;
            color: white;
            padding: 15px;
            margin: 0;
        }
        .productos {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 180px;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }
        .card img {
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h1>Mi Minimarket</h1>

<div class="productos">
    <div class="card">
        <img src="img/frutas.jpg" alt="Frutas">
        <p>Frutas</p>
    </div>

    <div class="card">
        <img src="img/bebidas.jpg" alt="Bebidas">
        <p>Bebidas</p>
    </div>

    <div class="card">
        <img src="img/limpieza.jpg" alt="Limpieza">
        <p>Limpieza</p>
    </div>
</div>

</body>
</html>
